<!DOCTYPE html><html lang="pt-BR"><head><title>Entrar — Find Out</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="img/logo.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Sora:wght@500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<main class="auth"><div class="box">
<a class="brand mb-4" href="index.html"><img src="img/logo.jpg" alt="">Find Out</a>
<ul class="nav nav-tabs mb-4"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t-login">Login</button></li><li class="nav-item"><button class="nav-link" id="tab-signup" data-bs-toggle="tab" data-bs-target="#t-signup">Sign Up</button></li></ul>
<div id="msg" class="alert-fo d-none" role="alert"></div>
<div class="tab-content">
<form class="tab-pane fade show active" id="t-login">
<div class="mb-3"><label class="form-label" for="l-id">E-mail, telefone ou nome de usuário</label><input class="form-control" id="l-id" required autocomplete="username"></div>
<div class="mb-4"><label class="form-label" for="l-pw">Senha</label><input type="password" class="form-control" id="l-pw" required autocomplete="current-password"></div>
<button class="btn btn-fo w-100">Entrar</button></form>
<form class="tab-pane fade" id="t-signup">
<div class="mb-3"><label class="form-label" for="s-user">Nome de usuário</label><input class="form-control" id="s-user" required pattern="[A-Za-z0-9_.]{3,20}" title="3 a 20 caracteres: letras, números, _ ou ."></div>
<div class="mb-3"><label class="form-label" for="s-mail">E-mail</label><input type="email" class="form-control" id="s-mail" required></div>
<div class="mb-3"><label class="form-label" for="s-tel">Telefone (com DDD)</label><input type="tel" class="form-control" id="s-tel" required placeholder="19999999999"></div>
<div class="mb-4"><label class="form-label" for="s-pw">Senha (mínimo 6 caracteres)</label><input type="password" class="form-control" id="s-pw" minlength="6" required autocomplete="new-password"></div>
<button class="btn btn-fo w-100">Criar conta</button></form>
</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/auth.js"></script></body></html>
